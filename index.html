<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TREASURE DAY 💎</title>

  <meta name="theme-color" content="#0F1115">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Splash -->
  <div id="splash">
    <div class="diamond">💎</div>
    <h1>TREASURE DAY</h1>
    <p>Have a Treasure Day.</p>
  </div>

  <!-- HOME -->
  <main id="app">

    <header class="hero">

      <div class="event">
        <p class="label">NEXT EVENT</p>

        <h2>THE STAGE</h2>

        <p>IGアリーナ</p>

        <p>2026.08.01</p>

      </div>

      <div class="countdown">

        <span id="dday">D-DAY</span>

      </div>

    </header>
<section class="card">

    <h3>✏️ イベント編集</h3>

    <input id="event-name" type="text" placeholder="イベント名">

    <input id="event-place" type="text" placeholder="会場">

    <input id="event-date" type="date">

    <button id="save-event">
        保存
    </button>

</section>
    
    <section class="card">

      <h3>🎒 持ち物</h3>

      <div class="check-actions">
    <button id="check-all">全部チェック</button>
    <button id="clear-all">リセット</button>
</div>
  
      <div class="progress">

        <div id="progress-bar"></div>

      </div>

      <div class="percent">
        0%
      </div>

      <div id="checklist">

      </div>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
